name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check-repository.py
      - run: python3 -m compileall -q tools 3ds/tools 3ds/tests
      - name: Native audio headroom and pixel icon geometry
        run: |
          python3 3ds/tests/run-audio-gain.py
          python3 3ds/tests/run-update-icon.py
          python3 3ds/tests/run-site-progress.py
          python3 3ds/tests/run-music-stream.py
          python3 3ds/tests/run-reader-cache-fs.py
      - name: Recognizing installed apps and ROMs (production detect.c, rom_find.c)
        run: |
          sudo apt-get install -y --no-install-recommends libjansson-dev zlib1g-dev > /dev/null
          python3 3ds/tests/run-detect.py
          python3 3ds/tests/run-rom-find.py
      - name: JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find src/js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
